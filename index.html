<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Pembelajaran Interaktif - Edukreasiku</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
        }

        /* Header Hero */
        header {
            background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 100%);
            color: white;
            padding: 50px 20px 65px;
            text-align: center;
            border-bottom-left-radius: 24px;
            border-bottom-right-radius: 24px;
            box-shadow: 0 10px 25px -5px rgba(37, 99, 235, 0.2);
        }

        header h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 10px;
            letter-spacing: -0.5px;
        }

        header p {
            font-size: 1rem;
            color: #dbeafe;
            max-width: 600px;
            margin: 0 auto 25px;
        }

        /* Kotak Pencarian Responsif */
        .search-wrapper {
            max-width: 560px;
            margin: 0 auto;
            position: relative;
            transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .search-wrapper:focus-within {
            transform: scale(1.02);
        }

        .search-input {
            width: 100%;
            padding: 16px 48px 16px 50px;
            border-radius: 50px;
            border: 2px solid transparent;
            font-family: inherit;
            font-size: 0.95rem;
            color: var(--text-main);
            background-color: #ffffff;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.15);
            outline: none;
            transition: all 0.25s ease;
        }

        .search-input:focus {
            border-color: #93c5fd;
            box-shadow: 0 0 0 5px rgba(255, 255, 255, 0.25), 0 15px 30px -5px rgba(0, 0, 0, 0.2);
        }

        .search-icon {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 1.15rem;
            pointer-events: none;
            transition: transform 0.25s ease;
        }

        .search-wrapper:focus-within .search-icon {
            transform: translateY(-50%) scale(1.15);
        }

        /* Tombol Clear Search */
        .clear-btn {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%) scale(0.8);
            background: #e2e8f0;
            color: #475569;
            border: none;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .clear-btn.visible {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(-50%) scale(1);
        }

        .clear-btn:hover {
            background: #cbd5e1;
            color: #0f172a;
        }

        .clear-btn:active {
            transform: translateY(-50%) scale(0.9);
        }

        /* Container Utama */
        .container {
            max-width: 960px;
            margin: -25px auto 50px;
            padding: 0 20px;
        }

        /* Tombol Filter Kategori Interaktif */
        .filter-bar {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            background: var(--card-bg);
            padding: 14px 18px;
            border-radius: 18px;
            margin-bottom: 25px;
            box-shadow: 0 6px 16px -4px rgba(0, 0, 0, 0.07);
            border: 1px solid var(--border-color);
        }

        .filter-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background-color: #f1f5f9;
            color: var(--text-muted);
            border: 1px solid transparent;
            padding: 9px 16px;
            border-radius: 50px;
            font-family: inherit;
            font-size: 0.875rem;
            font-weight: 600;
            cursor: pointer;
            user-select: none;
            transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .filter-btn:hover {
            background-color: #e2e8f0;
            color: var(--text-main);
            transform: translateY(-2px);
        }

        /* Efek membal saat tombol diklik */
        .filter-btn:active {
            transform: scale(0.93);
        }

        .filter-btn.active {
            background-color: var(--primary);
            color: #ffffff;
            box-shadow: 0 6px 14px -3px rgba(37, 99, 235, 0.45);
            transform: translateY(-1px);
        }

        .filter-btn.active:active {
            transform: scale(0.94);
        }

        .count-badge {
            background-color: rgba(0, 0, 0, 0.08);
            color: inherit;
            font-size: 0.75rem;
            padding: 2px 7px;
            border-radius: 20px;
            font-weight: 700;
            transition: background-color 0.2s ease;
        }

        .filter-btn.active .count-badge {
            background-color: rgba(255, 255, 255, 0.25);
            color: #ffffff;
        }

        /* Animasi Muncul Kartu & Kategori */
        @keyframes fadeSlideUp {
            from {
                opacity: 0;
                transform: translateY(10px) scale(0.98);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* Bagian Kategori */
        .category-section {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 30px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            border: 1px solid var(--border-color);
            animation: fadeSlideUp 0.3s ease forwards;
        }

        .category-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 2px solid #f1f5f9;
        }

        .category-badge {
            background-color: #eff6ff;
            color: var(--primary);
            padding: 6px 12px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.95rem;
        }

        /* Grid Kartu Materi */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 16px;
        }

        .card {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            background-color: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            text-decoration: none;
            color: inherit;
            transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
            animation: fadeSlideUp 0.3s ease forwards;
        }

        .card:hover {
            transform: translateY(-4px);
            border-color: var(--primary);
            box-shadow: 0 12px 20px -8px rgba(37, 99, 235, 0.18);
        }

        .card:active {
            transform: scale(0.98);
        }

        .card-tag {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            color: var(--primary);
            margin-bottom: 8px;
            display: inline-block;
        }

        .card-title {
            font-size: 1.05rem;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 16px;
        }

        /* Sorotan teks hasil pencarian */
        mark.highlight {
            background-color: #fef08a;
            color: #854d0e;
            padding: 0 3px;
            border-radius: 4px;
        }

        .card-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--primary);
            padding-top: 12px;
            border-top: 1px dashed var(--border-color);
        }

        .card:hover .card-footer span {
            transform: translateX(4px);
            transition: transform 0.2s ease;
        }

        /* Pesan Jika Tidak Ditemukan */
        .empty-state {
            display: none;
            text-align: center;
            background: white;
            padding: 45px 20px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            animation: fadeSlideUp 0.3s ease forwards;
        }

        .reset-search-btn {
            margin-top: 16px;
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 50px;
            font-family: inherit;
            font-size: 0.875rem;
            font-weight: 600;
            cursor: pointer;
